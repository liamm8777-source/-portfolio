<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LiamPortfolio</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var locationRef = window.location;
        var origin = locationRef.protocol + '//' + locationRef.hostname + (locationRef.port ? ':' + locationRef.port : '');
        var repoBase = locationRef.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var routePath = locationRef.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~');
        var search = locationRef.search ? '&' + locationRef.search.slice(1).replace(/&/g, '~and~') : '';

        locationRef.replace(origin + repoBase + '/?/' + routePath + search + locationRef.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
